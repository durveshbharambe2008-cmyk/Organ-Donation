<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Organ Donation Management System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <h1 class="login-title">Organ Donation Desk</h1>
        <p class="login-subtitle">Hospital Staff Portal</p>
      </div>

      <div id="login-error" class="login-error-msg" style="display: none;"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username" autofocus>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary btn-block">Sign in</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('login-error');
    const submitBtn = document.getElementById('btn-submit');

    // Check if already signed in
    fetch('/api/auth/me')
      .then(res => {
        if (res.ok) window.location.href = '/';
      })
      .catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      errorBox.textContent = '';
      
      const username = form.username.value.trim();
      const password = form.password.value;

      if (!username || !password) {
        errorBox.textContent = 'Please enter both username and password.';
        errorBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await response.json();

        if (response.ok) {
          window.location.href = '/';
        } else {
          errorBox.textContent = data.error || 'Invalid username or password.';
          errorBox.style.display = 'block';
        }
      } catch (err) {
        errorBox.textContent = 'Unable to connect to the server. Please try again.';
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
